name: CI/CD Pipeline - Lint, Test & Push to Docker Hub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: HTML Lint Check
        uses: CybozuLab/html-linter-action@v1
        with:
          target: 'index.html'
        continue-on-error: true

      - name: Basic Smoke Test
        run: |
          if grep -q "AURAMART" index.html; then
            echo "Smoke test passed: Brand title found."
          else
            echo "Smoke test failed: Brand title missing." && exit 1
          fi

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-website:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-website:${{ github.sha }}

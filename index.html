<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AURAMART - 1000 Products Store</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }
    header {
      background-color: #232f3e;
      color: white;
      text-align: center;
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .container {
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .stats {
      font-size: 1.1rem;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
      background-color: #e0e0e0;
    }
    .product-card h3 {
      font-size: 0.95rem;
      margin: 10px 0 5px;
      color: #333;
    }
    .category {
      font-size: 0.8rem;
      color: #777;
    }
    .price {
      color: #b12704;
      font-size: 1.1rem;
      font-weight: bold;
      margin: 10px 0;
    }
    .btn {
      background-color: #ffd814;
      border: 1px solid #fcd200;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:hover { background-color: #f7ca00; }
  </style>
</head>
<body>

  <header>
    <h1>AURAMART Shopping Catalog</h1>
  </header>

  <div class="container">
    <div class="stats">Showing <span id="count">0</span> Products</div>
    <div class="product-grid" id="catalog"></div>
  </div>

  <script>
    const categories = ['Electronics', 'Fashion', 'Home & Kitchen', 'Books', 'Sports', 'Beauty'];
    const catalog = document.getElementById('catalog');
    
    // Generate 1,000 product cards with unique images and prices
    for (let i = 1; i <= 1000; i++) {
      const category = categories[i % categories.length];
      const price = (Math.floor(Math.random() * 200) + 9.99).toFixed(2);
      const imageUrl = `https://picsum.photos/seed/${i}/200/180`;
      
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div>
          <img src="${imageUrl}" alt="Product ${i}" loading="lazy" />
          <span class="category">${category}</span>
          <h3>AURAMART Premium Item #${i}</h3>
        </div>
        <div>
          <div class="price">$${price}</div>
          <button class="btn">Add to Cart</button>
        </div>
      `;
      catalog.appendChild(card);
    }

    document.getElementById('count').innerText = 1000;
  </script>

</body>
</html>

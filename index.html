<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AURAMART - Online Shopping Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }
    header {
      background-color: #232f3e;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
    }
    .product-card h3 {
      font-size: 1rem;
      margin: 10px 0 5px;
    }
    .price {
      color: #b12704;
      font-size: 1.1rem;
      font-weight: bold;
      margin: 8px 0;
    }
    .btn {
      background-color: #ffd814;
      border: 1px solid #fcd200;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>AURAMART</h1>
    <p>Your Favorite Shopping Destination</p>
  </header>

  <div class="container">
    <h2>Featured Products (100 Items)</h2>
    <div class="product-grid" id="catalog"></div>
  </div>

  <script>
    const catalog = document.getElementById('catalog');
    
    // Add 100 product images and prices
    for (let i = 1; i <= 100; i++) {
      const price = (Math.floor(Math.random() * 150) + 9.99).toFixed(2);
      const imageUrl = `https://picsum.photos/seed/${i}/200/180`;
      
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <img src="${imageUrl}" alt="Product ${i}" loading="lazy" />
        <h3>AURAMART Product #${i}</h3>
        <div class="price">$${price}</div>
        <button class="btn">Add to Cart</button>
      `;
      catalog.appendChild(card);
    }
  </script>

</body>
</html>

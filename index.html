<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AURAMART - 1000 Products Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f9;
    }
    header {
      text-align: center;
      padding: 20px;
      background-color: #232f3e;
      color: white;
      margin-bottom: 20px;
    }
    .stats {
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .product-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .product-card h3 {
      font-size: 1rem;
      margin: 10px 0 5px;
    }
    .price {
      color: #b12704;
      font-weight: bold;
    }
    .btn {
      background-color: #ffd814;
      border: 1px solid #fcd200;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>AURAMART Shopping Catalog</h1>
  </header>

  <div class="stats">
    Displaying <span id="count">0</span> Items
  </div>

  <div class="product-grid" id="catalog"></div>

  <script>
    const categories = ['Electronics', 'Clothing', 'Home', 'Books', 'Toys', 'Sports'];
    const catalog = document.getElementById('catalog');
    
    // Dynamically generate 1,000 product items
    for (let i = 1; i <= 1000; i++) {
      const category = categories[i % categories.length];
      const price = (Math.random() * 100 + 5).toFixed(2);
      
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <h3>Item #${i} - ${category}</h3>
        <p class="price">$${price}</p>
        <button class="btn">Add to Cart</button>
      `;
      catalog.appendChild(card);
    }

    document.getElementById('count').innerText = 1000;
  </script>

</body>
</html>

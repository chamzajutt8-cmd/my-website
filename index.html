<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AURAMART - Online Shopping</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
    }
    header {
      background-color: #1e293b;
      color: #fff;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    header h1 { font-size: 1.8rem; letter-spacing: 1px; }
    header nav a {
      color: #94a3b8;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
    }
    header nav a:hover { color: #fff; }
    
    .hero {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      text-align: center;
      padding: 50px 20px;
    }
    .hero h2 { font-size: 2.2rem; margin-bottom: 10px; }
    .hero p { font-size: 1.1rem; opacity: 0.9; }

    .main-container {
      max-width: 1280px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .section-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }
    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #cbd5e1;
    }
    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .product-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
    }
    .product-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 12px;
    }
    .add-btn {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-btn:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>

  <header>
    <h1>AURAMART</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Cart</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Welcome to AURAMART Store</h2>
    <p>Discover 100+ exclusive deals on top-quality items!</p>
  </section>

  <main class="main-container">
    <h3 class="section-title">All Products (100 Items)</h3>
    <div class="products-grid" id="products-grid"></div>
  </main>

  <script>
    const container = document.getElementById('products-grid');
    const categories = ['Electronics', 'Fashion', 'Home', 'Gadgets', 'Accessories'];

    // Dynamically insert 100 items into the exact original design grid
    for (let i = 1; i <= 100; i++) {
      const category = categories[i % categories.length];
      const price = (Math.floor(Math.random() * 180) + 12.99).toFixed(2);
      const imageUrl = `https://picsum.photos/seed/${i}/220/180`;

      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <img src="${imageUrl}" alt="${category} Item ${i}" loading="lazy" />
        <div class="card-body">
          <div>
            <div class="product-title">AURAMART ${category} #${i}</div>
            <div class="product-price">$${price}</div>
          </div>
          <button class="add-btn">Add to Cart</button>
        </div>
      `;
      container.appendChild(card);
    }
  </script>

</body>
</html>
